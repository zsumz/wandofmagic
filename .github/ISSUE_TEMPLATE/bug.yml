name: Bug report
description: Report incorrect runtime behavior, inference, packaging, or diagnostics.
title: "bug: "
labels: ["kind:bug"]
body:
  - type: markdown
    attributes:
      value: Please remove or redact sensitive data before posting a reproduction.
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Include input type, spell, input value, observed result, and expected result.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Wandofmagic version or commit
    validations:
      required: true
  - type: input
    id: typescript
    attributes:
      label: TypeScript version
    validations:
      required: true
  - type: input
    id: runtime
    attributes:
      label: Runtime and version
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: Safety check
      options:
        - label: The report contains no credentials, tokens, or personal data.
          required: true
