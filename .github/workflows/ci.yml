name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        if: matrix.node-version == 24
        run: npm run lint

      - name: Check architecture
        if: matrix.node-version == 24
        run: npm run architecture:check

      - name: Typecheck source and tests
        run: npm run typecheck

      - name: Typecheck public API fixtures
        run: npm run typecheck:types

      - name: Run tests
        run: npm test

      - name: Check coverage
        if: matrix.node-version == 24
        run: npm run coverage

      - name: List package smoke tests
        if: matrix.node-version == 24
        run: npm run smoke:list

      - name: Run package smoke tests
        if: matrix.node-version == 24
        run: npm run smoke

      - name: Inspect package contents
        run: npm pack --dry-run --json
