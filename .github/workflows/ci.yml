name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node-version: ['22.18.0', '24']

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit

      - name: Build
        run: npm run build

      - name: Lint
        if: matrix.node-version == '24'
        run: npm run lint

      - name: Check architecture
        if: matrix.node-version == '24'
        run: npm run architecture:check

      - name: Typecheck source and tests
        run: npm run typecheck

      - name: Typecheck public API fixtures
        run: npm run typecheck:types

      - name: Run tests
        run: npm test

      - name: Check coverage
        if: matrix.node-version == '24'
        run: npm run coverage

      - name: List package smoke tests
        if: matrix.node-version == '24'
        run: npm run smoke:list

      - name: Check package conformance
        if: matrix.node-version == '24'
        run: npm run check:package:conformance

      - name: Run package smoke tests
        run: npm run smoke

      - name: Inspect package contents
        run: npm pack --dry-run --json

  minimum-typescript:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit

      - name: Build with repository TypeScript
        run: npm run build

      - name: Install minimum TypeScript
        run: npm install --no-save --package-lock=false --ignore-scripts --no-audit typescript@5.8.3

      - name: Typecheck public API fixtures
        run: npm exec -- tsc -p tsconfig.types.json
